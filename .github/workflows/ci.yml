name: CI

# Roda a cada push na main e em todo pull request.
on:
  push:
    branches: [main]
  pull_request:

# Permissão mínima: o CI só lê o código.
permissions:
  contents: read

# Um push novo cancela a execução antiga da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes + PostgreSQL real)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # O runner tem Docker: os testes com Testcontainers rodam de verdade (não são pulados).
      - name: Testes e empacotamento
        run: ./mvnw -B verify

  frontend:
    name: Frontend (tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Dependências de produção com vulnerabilidade alta ou crítica derrubam o CI.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Ponta a ponta (navegador + acessibilidade)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Sobe a pilha completa (nginx + backend + PostgreSQL)
        run: npm run e2e:up
      - name: Testes de ponta a ponta
        run: npm run e2e
      - name: Guarda relatório e imagens das telas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-resultados
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/e2e-shots
          if-no-files-found: ignore
          retention-days: 7
      - name: Mostra os logs da pilha se algo falhou
        if: failure()
        run: docker compose --env-file e2e/e2e.env -p bd360-e2e -f ../docker-compose.yml --profile full logs --tail=200
      - name: Derruba a pilha
        if: always()
        run: npm run e2e:down
