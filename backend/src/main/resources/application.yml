spring:
  application:
    name: biblioteca-digital-360
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/biblioteca}
    username: ${DB_USER:biblioteca}
    password: ${DB_PASSWORD}   # sem valor padrão: defina DB_PASSWORD no ambiente (a aplicação não sobe sem ela)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # o esquema é só das migrações Flyway
  flyway:
    enabled: true
  mail:
    properties:
      # Sem tempo limite o JavaMail espera para sempre: uma conexão pendurada travaria a entrega dos avisos e o agendador.
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
      # Provedores de verdade pedem login e STARTTLS (porta 587) ou SSL direto (porta 465, MAIL_SMTP_SSL=true).
      # Servidor local sem senha: MAIL_SMTP_AUTH=false MAIL_SMTP_STARTTLS=false.
      "[mail.smtp.auth]": ${app.notifications.smtp.auth}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:true}
      "[mail.smtp.ssl.enable]": ${MAIL_SMTP_SSL:false}
  data:
    web:
      pageable:
        max-page-size: 100     # ninguém pede a tabela inteira de uma vez

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # Queda do servidor de e-mail não pode marcar o sistema todo como fora do ar (o Docker reiniciaria o container).
      # Os avisos têm tentativas próprias (tabela notifications); a saúde considera só o que é essencial (banco).
      enabled: false

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}   # endereço do site nos links dos e-mails (https://seu-dominio em produção)
  privacy:
    contact: ${PRIVACY_CONTACT:}   # texto livre mostrado em /privacidade: encarregado (DPO) e como falar com ele
  notifications:
    smtp:
      auth: ${MAIL_SMTP_AUTH:true}
  jwt:
    secret: ${JWT_SECRET}          # obrigatório, mínimo 32 caracteres; sem padrão
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  admin:                           # cria o 1º SUPER_ADMIN só se não houver nenhum usuário
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
