# Cabeçalhos de segurança. Ficam num arquivo à parte porque o nginx NÃO herda add_header de um bloco
# para outro quando o bloco filho define algum: cada location precisa incluir este arquivo.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Só scripts e estilos do próprio site. 'unsafe-inline' em estilo é necessário porque a biblioteca de gráficos
# aplica estilos em linha; script NÃO aceita inline. Imagens de capa podem vir de endereços https/http.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
