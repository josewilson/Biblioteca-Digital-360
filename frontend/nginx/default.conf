server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # API: repassa ao backend (nome do serviço no docker compose).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # o cliente não consegue forjar: sobrescreve, não acrescenta
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
        include /etc/nginx/security-headers.conf;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Qualquer outra rota é do React Router: devolve o index.html (sem cache, para pegar versões novas).
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}
