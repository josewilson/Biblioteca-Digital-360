spring:
  application:
    name: biblioteca-digital-360
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/biblioteca}
    username: ${DB_USER:biblioteca}
    password: ${DB_PASSWORD}   # sem valor padrão: defina DB_PASSWORD no ambiente (a aplicação não sobe sem ela)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # o esquema é só das migrações Flyway
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # Queda do servidor de e-mail nao pode marcar o sistema todo como fora do ar (o Docker reiniciaria o container).
      # Os avisos tem tentativas proprias (tabela notifications); a saude considera so o que e essencial (banco).
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}          # obrigatório, mínimo 32 caracteres; sem padrão
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  admin:                           # cria o 1º SUPER_ADMIN só se não houver nenhum usuário
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
