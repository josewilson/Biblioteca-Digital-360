# HTTPS na frente do site. Uso:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml --profile full up -d --build
# Precisa no .env: DOMAIN=biblioteca.exemplo.com.br e WEB_BIND=127.0.0.1 (o site deixa de ser acessível direto de fora).
# O domínio deve apontar para este servidor e as portas 80 e 443 devem estar abertas (certificado Let's Encrypt).
services:
  caddy:
    profiles: ["full"]
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificados: não apague, há limite de emissões por domínio
    depends_on:
      - web
    restart: unless-stopped
    mem_limit: 128m
  web:
    volumes:
      - ./deploy/real-ip-proxy.conf:/etc/nginx/real-ip.conf:ro
volumes:
  caddy_data:
