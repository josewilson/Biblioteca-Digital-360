# Só o banco, para desenvolvimento local. A aplicação roda pelo IntelliJ ou `mvnw spring-boot:run`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: ${DB_USER:-biblioteca}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "${DB_PORT:-5435}:5432"   # 5435 é a porta que o application.yml usa por padrão
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
