# Desenvolvimento (padrão): só o banco.            docker compose up -d
# Aplicação completa (banco + backend + web):     docker compose --profile full up -d --build
# Depois abra http://localhost:3000 (porta mude com WEB_PORT). Variáveis: veja o LEIA-ME.md.
name: biblioteca-digital-360   # fixa o nome do projeto: renomear a pasta não troca containers nem volume

# Logs com rotação: sem isto o log do Docker cresce até encher o disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: ${DB_USER:-biblioteca}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      # Só a própria máquina alcança o banco (127.0.0.1): ele não fica exposto na rede.
      - "127.0.0.1:${DB_PORT:-5433}:5432"   # mesma porta padrão do application.yml (spring.datasource.url)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-biblioteca} -d biblioteca"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m          # ajuste ao servidor
    logging: *logging

  backend:
    profiles: ["full"]
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/biblioteca
      DB_USER: ${DB_USER:-biblioteca}
      DB_PASSWORD: ${DB_PASSWORD}
      # Sem valor padrão de propósito: vazio faz o backend recusar subir ("JWT_SECRET precisa ter pelo menos 32 caracteres").
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Atrás do nginx: lê o IP real do cliente (para a auditoria e o bloqueio). Seguro porque a porta 8080 não é publicada.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      APP_NOTIFICATIONS_CHANNEL: ${APP_NOTIFICATIONS_CHANNEL:-log}
      APP_NOTIFICATIONS_FROM: ${APP_NOTIFICATIONS_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}           # false só em servidor local sem senha
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}   # porta 587
      MAIL_SMTP_SSL: ${MAIL_SMTP_SSL:-false}            # true na porta 465
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m          # a JVM usa 75% disso (MaxRAMPercentage); ajuste ao servidor
    logging: *logging

  # Backup diário do banco (formato custom do pg_dump) no volume "backups". Guarda BACKUP_KEEP_DAYS dias (padrão 14).
  # O volume está no mesmo servidor: copie os arquivos para fora dele (docs/DEPLOYMENT.md).
  backup:
    profiles: ["full"]
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-biblioteca}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: biblioteca
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          f=/backups/biblioteca-$$(date +%Y-%m-%d-%H%M).dump
          pg_dump -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup ok: $$f" || echo "BACKUP FALHOU" >&2
          find /backups -name 'biblioteca-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

  # Cópia dos backups para fora do servidor (opcional): só liga se BACKUP_REMOTE estiver preenchido. Usa rclone, que fala com
  # S3 (AWS, Backblaze B2, Wasabi, MinIO...), Google Drive, SFTP etc. Exemplo para S3, no .env:
  #   BACKUP_REMOTE=offsite:meu-bucket/biblioteca
  #   RCLONE_CONFIG_OFFSITE_TYPE=s3  RCLONE_CONFIG_OFFSITE_PROVIDER=AWS  RCLONE_CONFIG_OFFSITE_REGION=sa-east-1
  #   RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID=...  RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY=...
  # "copy" nunca apaga no destino: a retenção de lá é com o próprio provedor (regra de ciclo de vida do bucket).
  backup-sync:
    profiles: ["full"]
    image: rclone/rclone:1.76.0
    environment:
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${RCLONE_CONFIG_OFFSITE_REGION:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$BACKUP_REMOTE" ]; then
          echo "BACKUP_REMOTE vazio: cópia dos backups para fora do servidor está DESLIGADA."
          exec tail -f /dev/null
        fi
        while true; do
          rclone copy /backups "$BACKUP_REMOTE" --include 'biblioteca-*.dump' --include 'antes-*.dump'             && echo "cópia externa ok" || echo "COPIA EXTERNA FALHOU" >&2
          sleep 3600
        done
    volumes:
      - backups:/backups:ro
    depends_on:
      - backup
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

  web:
    profiles: ["full"]
    build: ./frontend
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:80"   # com HTTPS (docker-compose.tls.yml), use WEB_BIND=127.0.0.1
    depends_on:
      - backend
    environment:
      LOGIN_RATE: ${LOGIN_RATE:-30r/m}   # tentativas de login por IP; só o ambiente de teste de ponta a ponta sobe isto
    healthcheck:
      # Só o próprio nginx: o /healthz depende do backend, que leva até ~100 s para subir, e marcaria o site como doente à toa.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
  backups:
